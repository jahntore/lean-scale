<svg xmlns="http://www.w3.org/2000/svg" lang="nb" xml:lang="nb" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="title description">
  <title id="title">Len deg tilbake. Les like lett.</title>
  <desc id="description">To illustrasjoner forklarer lean-scale. Når du sitter nær webkameraet, beholder grensesnittet vanlig størrelse. Når du lener deg tilbake, blir det større. Ansiktssporingen skjer lokalt, med to stabile skaleringsnivåer og mulighet til å sette på pause.</desc>
  <defs>
    <style>
      .sans { font-family: 'DejaVu Sans', sans-serif; }
      .serif { font-family: 'DejaVu Serif', Georgia, serif; }
      .ink { fill: #252d29; }
      .muted { fill: #626a60; }
      .accent { fill: #ad4224; }
      .line { fill: none; stroke: #252d29; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .fine { fill: none; stroke: #bcbfb0; stroke-width: 1.5; }
      .person { fill: none; stroke: #252d29; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .signal { fill: none; stroke: #ad4224; stroke-width: 2; stroke-dasharray: 4 7; }
    </style>
  </defs>
  <rect width="1200" height="744" rx="4" fill="#f4f1e9"/>
  <g class="sans">
    <text x="64" y="65" class="ink" font-size="22" font-weight="700" letter-spacing="-1">lean-scale<tspan class="accent">↗</tspan></text>
    <text x="1136" y="63" text-anchor="end" class="muted" font-size="12" letter-spacing="2">LITT MER KOMFORT I HYPRLAND</text>
  </g>
  <text x="60" y="160" class="serif ink" font-size="68" letter-spacing="-3">Len deg tilbake.</text>
  <text x="60" y="242" class="serif accent" font-size="68" font-style="italic" letter-spacing="-3">Les like lett.</text>
  <g class="sans ink" font-size="23">
    <text x="740" y="160">Kameraet anslår avstanden.</text>
    <text x="740" y="196">Skrivebordet tilpasser størrelsen.</text>
  </g>
  <path d="M64 290H1136" class="fine"/>
  <path d="M600 322V617" class="fine"/>
  <g class="sans" font-size="13" font-weight="700" letter-spacing="1.5">
    <text x="64" y="330" class="muted">01 / SITT NÆR</text>
    <text x="656" y="330" class="accent">02 / LEN DEG TILBAKE</text>
  </g>

  <!-- Samme skrivebord og skjerm, to ulike avstander. -->
  <g transform="translate(64 360)">
    <path d="M287 170H470M310 170V210M453 170V210" class="line"/>
    <rect x="300" y="34" width="144" height="108" rx="5" fill="#e1e3d7" stroke="#252d29" stroke-width="3"/>
    <rect x="308" y="42" width="128" height="92" fill="#f4f1e9"/>
    <circle cx="372" cy="30" r="4" fill="#ad4224"/>
    <path d="M372 143V169M349 169H395" class="line"/>
    <text x="322" y="85" class="serif ink" font-size="26">Aa</text>
    <path d="M322 100H411M322 110H396M322 120H406" fill="none" stroke="#a4ac98" stroke-width="3"/>
    <path d="M190 59L365 30" class="signal"/>
    <circle cx="170" cy="59" r="20" fill="#d9dfca" stroke="#252d29" stroke-width="4"/>
    <circle cx="180" cy="57" r="2.5" fill="#252d29"/>
    <path d="M171 82L158 139L210 150L228 201M166 104L219 142H275" class="person"/>
    <path d="M134 106L126 155H195M151 156V205M128 209H176" class="line"/>
    <path d="M92 211H485" class="fine"/>
    <text x="0" y="252" class="sans ink" font-size="22" font-weight="700">Arbeidsplassen du er vant til.</text>
    <text x="0" y="282" class="sans muted" font-size="16">Vanlig sittestilling. Vanlig størrelse.</text>
  </g>

  <g transform="translate(656 360)">
    <path d="M287 170H470M310 170V210M453 170V210" class="line"/>
    <rect x="300" y="34" width="144" height="108" rx="5" fill="#e1e3d7" stroke="#252d29" stroke-width="3"/>
    <rect x="308" y="42" width="128" height="92" fill="#f4f1e9"/>
    <circle cx="372" cy="30" r="4" fill="#ad4224"/>
    <path d="M372 143V169M349 169H395" class="line"/>
    <text x="320" y="99" class="serif accent" font-size="49">Aa</text>
    <path d="M322 116H418" fill="none" stroke="#a4ac98" stroke-width="5"/>
    <path d="M95 45L365 30" class="signal"/>
    <circle cx="75" cy="45" r="20" fill="#d9dfca" stroke="#252d29" stroke-width="4"/>
    <circle cx="85" cy="44" r="2.5" fill="#252d29"/>
    <path d="M86 68L131 139L190 151L211 201M106 99L167 135H223" class="person"/>
    <path d="M65 95L111 156H177M135 157V205M112 209H160" class="line"/>
    <path d="M40 211H485" class="fine"/>
    <text x="0" y="252" class="sans ink" font-size="22" font-weight="700">Litt lenger unna. Litt større.</text>
    <text x="0" y="282" class="sans muted" font-size="16">Samme skjerm. Mindre mysing.</text>
  </g>

  <path d="M64 675H1136" class="fine"/>
  <g class="sans ink" font-size="12" font-weight="700" letter-spacing="1.2">
    <circle cx="69" cy="709" r="4" fill="#ad4224"/>
    <text x="85" y="713">LOKAL BILDEBEHANDLING</text>
    <circle cx="456" cy="709" r="4" fill="#ad4224"/>
    <text x="472" y="713">TO STABILE SKALERINGSNIVÅER</text>
    <circle cx="906" cy="709" r="4" fill="#ad4224"/>
    <text x="922" y="713">PAUSE NÅR DU VIL</text>
  </g>
</svg>
