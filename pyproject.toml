[project]
name = "lean-scale"
version = "0.1.0"
description = "Local webcam-driven, posture-aware monitor scaling for Hyprland"
requires-python = ">=3.11,<3.14"
dependencies = ["opencv-python-headless>=4.10,<5"]

[project.scripts]
lean-scale = "lean_scale.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
